server:
  port: 8086

spring:
  application:
    name: analyse-service
  # Config Server facultatif tant qu'il n'est pas lancé
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:h2:mem:analyse_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # RabbitMQ (exchange topic medivault.events)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # message en erreur : rejeté sans être remis en boucle dans la file
        default-requeue-rejected: false

  # Circuit breaker (Resilience4j) sur l'appel OpenFeign vers dossier-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 4s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

medivault:
  # Analyses du parcours d'Ahmed (id de démonstration de user-service)
  seed:
    enabled: true
  rabbitmq:
    exchange: medivault.events
    queues:
      consultation-ajoutee: analyse.consultation-ajoutee
      rendezvous-confirme: analyse.rendezvous-confirme
      rendezvous-annule: analyse.rendezvous-annule
    routing-keys:
      consultation-ajoutee: consultation.ajoutee
      rendezvous-confirme: rendezvous.confirme
      rendezvous-annule: rendezvous.annule
      resultat-disponible: resultat.disponible

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
