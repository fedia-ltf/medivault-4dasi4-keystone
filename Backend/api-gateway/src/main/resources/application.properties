spring.application.name=gateway
server.port=9000

# eureka registration (méthode du cours : la Gateway s'inscrit et lit l'annuaire)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# CORS géré ICI seulement (aucun @CrossOrigin dans les services, voir SecurityConfig) : le front Angular est sur http://localhost:4200
medivault.cors.allowed-origins=http://localhost:4200
# si un service ajoutait aussi l'en-tête CORS, on n'en garde qu'un (sinon le navigateur bloque)
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Sécurité (voir SecurityConfig) : jeton JWT Keycloak obligatoire pour /api/** (sauf /api/auth/**),
# vérifié avec les clés publiques du realm medivault. Dans Docker : http://keycloak:8080/realms/...
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/medivault/protocol/openid-connect/certs

# Swagger unifié (voir DocumentationConfig) : http://localhost:9000/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=medicament-service
springdoc.swagger-ui.urls[0].url=/docs/medicament
springdoc.swagger-ui.urls[1].name=user-service
springdoc.swagger-ui.urls[1].url=/docs/user
springdoc.swagger-ui.urls[2].name=dossier-service
springdoc.swagger-ui.urls[2].url=/docs/dossier
springdoc.swagger-ui.urls[3].name=ordonnance-service
springdoc.swagger-ui.urls[3].url=/docs/ordonnance
springdoc.swagger-ui.urls[4].name=soin-domicile-service
springdoc.swagger-ui.urls[4].url=/docs/soin-domicile
springdoc.swagger-ui.urls[5].name=analyse-service
springdoc.swagger-ui.urls[5].url=/docs/analyse
springdoc.swagger-ui.urls[6].name=rendezvous-service
springdoc.swagger-ui.urls[6].url=/docs/rendezvous
springdoc.swagger-ui.urls-primary-name=medicament-service
springdoc.swagger-ui.persist-authorization=true

# --- Routes MediVault : uniquement des routes explicites (le front appelle http://localhost:9000/api/...) ---
# NB : adapté du projet Gateway du prof (candidat/job). Eureka et Gateway = projets fournis par le prof
# (Spring Boot 4.x / Cloud 2025.1+), les services métier restent en Spring Boot 3.5.x : ils communiquent en HTTP.

# Route medicament-service (médicaments sensibles)
spring.cloud.gateway.server.webflux.routes[0].id=medicament
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MEDICAMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/medicaments-sensibles/**,/api/attributions/**,/api/ventes/**,/api/disponibilites/**,/api/previsions/**,/api/risques/**,/api/tentatives-refusees/**

# Route user-service (connexion Keycloak, comptes, professionnels)
spring.cloud.gateway.server.webflux.routes[1].id=user
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**,/api/utilisateurs/**,/api/professionnels/**

# Route ordonnance-service
spring.cloud.gateway.server.webflux.routes[2].id=ordonnance
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDONNANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ordonnances/**

# Route dossier-service (chemin /api/dossiers, port 8082)
spring.cloud.gateway.server.webflux.routes[3].id=dossier
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DOSSIER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/dossiers/**

# Route soin-domicile-service
spring.cloud.gateway.server.webflux.routes[4].id=soin-domicile
spring.cloud.gateway.server.webflux.routes[4].uri=lb://SOIN-DOMICILE-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/infirmiers/**,/api/plans/**,/api/visites/**

# Route analyse-service
spring.cloud.gateway.server.webflux.routes[5].id=analyse
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ANALYSE-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/analyses/**

# Route rendezvous-service
spring.cloud.gateway.server.webflux.routes[6].id=rendezvous
spring.cloud.gateway.server.webflux.routes[6].uri=lb://RENDEZVOUS-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/creneaux/**,/api/rendezvous/**

# Logs : INFO pour la démo (mettre DEBUG pour voir quelle instance Eureka est choisie)
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO
