# =============================================================================
# dossier-service — Configuration locale (MySQL via XAMPP)
# =============================================================================

spring.application.name=dossier-service

# ---- Serveur ----
server.port=8085

# ---- MySQL / XAMPP ----
spring.datasource.url=jdbc:mysql://localhost:3306/dossier_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Config Server (optionnel, désactivé par défaut en local) ----
spring.config.import=optional:configserver:http://localhost:8888
