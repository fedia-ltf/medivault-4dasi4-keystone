# Nom du service : c'est ce nom qui apparait dans Eureka et qu'utilisent Feign et la Gateway
spring.application.name=medicament-service
server.port=8084

# Config Server : lit la configuration centralisee si elle existe ; "optional" = demarre meme sans lui
# Variables d'environnement (Docker) : CONFIG_SERVER_URL, DATA_DIR, DEMO_DATA, INTEGRATION_MODE, EUREKA_URL,
#   RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USER, RABBITMQ_PASSWORD. Chaque ${VARIABLE:valeur} utilise la
#   valeur après les deux-points si la variable n'existe pas : sans Docker, rien ne change.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Base H2 en FICHIER (medicament_db) : les donnees restent apres l'arret du service.
# Le fichier est cree dans le dossier "data/" a cote du pom.xml (il est ignore par Git).
# ddl-auto=update : Hibernate cree et met a jour les tables a partir des @Entity
# show-sql : affiche les requetes SQL dans la console
# h2-console : interface web http://localhost:8084/h2-console
#   -> JDBC URL : jdbc:h2:file:./data/medicament_db   user : sa   mot de passe : (vide)
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/medicament_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Donnees de demonstration (7 medicaments, quotas et ventes) : chargees une seule fois si la base est vide
medivault.demo-data=${DEMO_DATA:true}

# Verification des autres services avant une vente (ordonnance VALIDEE ? pharmacie active ?)
#   simule = donnees fictives, pour travailler seul (voir VerificationSimulee)
#   reel   = vrais appels OpenFeign vers ordonnance-service et user-service (Eureka doit etre lance)
medivault.integration.mode=${INTEGRATION_MODE:simule}

# RG4 : passage au nouveau mois (bilan + nouveaux quotas). Format cron : seconde minute heure jour mois jour-semaine
medivault.quota.renouvellement-cron=0 5 0 1 * *

# Eureka : adresse de l'annuaire ou le service s'inscrit au demarrage
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# OpenFeign + Resilience4j (circuit breaker avec fallback)
# timeouts : on attend 2 s pour se connecter, 3 s pour la reponse
# circuit breaker : sur les 10 derniers appels (minimum 5), si 50 % echouent
#   le disjoncteur s'ouvre 10 s : on n'appelle plus le service en panne, on utilise le fallback (vente refusee, 503)
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=4s

# RabbitMQ : connexion (lance avec Docker), exchange commun et cles de routage des 2 evenements publies
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2000
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.vente-sensible-enregistree=vente.sensible.enregistree
medivault.rabbitmq.routing-key.sanction-pharmacie=pharmacie.sanction

# Swagger / OpenAPI : http://localhost:8084/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator : pages de sante du service (/actuator/health) et etat du circuit breaker
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true