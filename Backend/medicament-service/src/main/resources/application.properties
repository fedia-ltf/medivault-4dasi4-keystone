# Nom du service : c'est ce nom qui apparait dans Eureka et qu'utilisent Feign et la Gateway
spring.application.name=medicament-service
server.port=8084

# Config Server : lit la configuration centralisee si elle existe ; "optional" = demarre meme sans lui
spring.config.import=optional:configserver:http://localhost:8888

# Base H2 en memoire (rien a installer, videe a chaque arret)
# ddl-auto=update : Hibernate cree les tables a partir des @Entity
# show-sql : affiche les requetes SQL dans la console
# h2-console : interface web http://localhost:8084/h2-console
spring.datasource.url=jdbc:h2:mem:medicament_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chargement du catalogue (data.sql) apres la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Eureka : adresse de l'annuaire ou le service s'inscrit au demarrage
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# OpenFeign + Resilience4j (circuit breaker avec fallback)
# timeouts : on attend 2 s pour se connecter, 3 s pour la reponse
# circuit breaker : sur les 10 derniers appels (minimum 5), si 50 % echouent
#   le disjoncteur s'ouvre 10 s : on n'appelle plus ordonnance-service, on utilise le fallback
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=4s

# Statut des ordonnances considerees comme actives (envoye a ordonnance-service par Feign)
# A aligner avec les statuts d'ordonnance-service (VALIDEE, PARTIELLEMENT_DELIVREE)
medivault.ordonnance.statut-actif=ACTIVE

# RabbitMQ : connexion (lance avec Docker), exchange, cles de routage et nom de notre file
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.medicament-retire=medicament.retire
medivault.rabbitmq.routing-key.ordonnance-delivree=ordonnance.delivree
medivault.rabbitmq.queue.ordonnance-delivree=medicament-service.ordonnance-delivree

# Swagger / OpenAPI : http://localhost:8084/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator : pages de sante du service (/actuator/health) et etat du circuit breaker
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true
