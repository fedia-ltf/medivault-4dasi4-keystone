# Configuration des tests : elle remplace application.properties pendant les tests.
# Pas de Config Server, pas d'Eureka, base H2 en memoire, autres microservices simules.
spring.application.name=medicament-service
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:
eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:medicament_test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

medivault.demo-data=false
medivault.integration.mode=simule
medivault.quota.renouvellement-cron=-

spring.cloud.openfeign.circuitbreaker.enabled=true

spring.rabbitmq.connection-timeout=500
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.vente-sensible-enregistree=vente.sensible.enregistree
medivault.rabbitmq.routing-key.sanction-pharmacie=pharmacie.sanction
medivault.rabbitmq.routing-key.quota-bientot-epuise=quota.bientot.epuise
