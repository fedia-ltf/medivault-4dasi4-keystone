spring.application.name=ordonnance-service

server.port=8085

# Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Base H2
spring.datasource.url=jdbc:mysql://localhost:3306/mediavault?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.servlet.context-path=/gestionlocation

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autolocc=INFO

# Chargement du catalogue (data.sql) apres la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Eureka désactivé pour tester le microservice localement.
# À réactiver lorsque le serveur Eureka est disponible :
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# OpenFeign + Resilience4j (circuit breaker avec fallback)
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=4s

# Statut des ordonnances considerees comme actives
medivault.ordonnance.statut-actif=ACTIVE

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.medicament-retire=medicament.retire
medivault.rabbitmq.routing-key.ordonnance-delivree=ordonnance.delivree
medivault.rabbitmq.queue.ordonnance-delivree=medicament-service.ordonnance-delivree

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true
