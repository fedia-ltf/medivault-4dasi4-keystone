server:
  port: 8087

spring:
  application:
    name: rendezvous-service
  # Config Server facultatif tant qu'il n'est pas lancé
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    # H2 en fichier : les créneaux et rendez-vous restent après un redémarrage
    url: jdbc:h2:file:./rendezvous-data/rendezvous_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # RabbitMQ (exchange topic medivault.events)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: true
        # RabbitMQ absent ou file pas encore créée : le service démarre quand même
        missing-queues-fatal: false
        # message en erreur : rejeté sans être remis en boucle dans la file
        default-requeue-rejected: false

  # Circuit breaker (Resilience4j) sur l'appel OpenFeign vers user-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

# Même temps limite que les autres services (par défaut Resilience4j coupe après 1 s)
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 4s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

medivault:
  rabbitmq:
    exchange: medivault.events
    queues:
      consultation-ajoutee: rendezvous.consultation-ajoutee
    routing-keys:
      consultation-ajoutee: consultation.ajoutee
      rendezvous-confirme: rendezvous.confirme
      rendezvous-annule: rendezvous.annule

springdoc:
  swagger-ui:
    path: /swagger-ui.html

