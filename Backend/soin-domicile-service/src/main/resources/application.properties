# Nom du service : c'est ce nom qui apparait dans Eureka et qu'utilisent Feign et la Gateway
spring.application.name=soin-domicile-service
server.port=8085

# Config Server : lit la configuration centralisee si elle existe ; "optional" = demarre meme sans lui
spring.config.import=optional:configserver:http://localhost:8888

# Base H2 en memoire (rien a installer, videe a chaque arret)
# ddl-auto=update : Hibernate cree les tables visite, plan_suivi et infirmier a partir des @Entity
# show-sql : affiche les requetes SQL dans la console
# h2-console : interface web http://localhost:8085/h2-console
# Les infirmiers de demonstration sont crees par config/DonneesDemo (pas de data.sql)
spring.datasource.url=jdbc:h2:file:./soin-domicile-data/soin_domicile_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka : desactive tant que le serveur Eureka (port 8761) n'est pas lance
# Quand il tourne : mettre true et supprimer les deux adresses directes plus bas
eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# OpenFeign + Resilience4j (circuit breaker avec fallback)
# timeouts : on attend 2 s pour se connecter, 3 s pour la reponse
# circuit breaker : sur les 10 derniers appels (minimum 5), si 50 % echouent
#   le disjoncteur s'ouvre 10 s : on n'appelle plus le service, on utilise le fallback (503)
# timelimiter : 4 s, sinon Resilience4j coupe l'appel au bout d'1 s par defaut
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=4s

# Sans Eureka : adresses directes des services appeles (a supprimer quand Eureka tourne)
spring.cloud.openfeign.client.config.ordonnance-service.url=http://localhost:8083
spring.cloud.openfeign.client.config.medicament-service.url=http://localhost:8084

# RG2 : statuts d'ordonnance qui autorisent une injection ou une prise de sang
medivault.ordonnance.statuts-acceptes=VALIDEE,PARTIELLEMENT_DELIVREE

# RabbitMQ : connexion (lance avec Docker), exchange, cles de routage et nom de notre file
# On publie soin.realise (vers dossier-service) et mesure.alerte (vers le medecin)
# On ecoute medicament.retire (publie par medicament-service)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.soin-realise=soin.realise
medivault.rabbitmq.routing-key.alerte-mesure=mesure.alerte
medivault.rabbitmq.routing-key.medicament-retire=medicament.retire
medivault.rabbitmq.queue.medicament-retire=soin-domicile-service.medicament-retire

# Swagger / OpenAPI : http://localhost:8085/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator : pages de sante du service (/actuator/health) et etat du circuit breaker
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true