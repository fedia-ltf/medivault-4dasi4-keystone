# Profil « keycloak » : active la vraie connexion. Lancer le user-service avec SPRING_PROFILES_ACTIVE=keycloak
# (Keycloak, MongoDB et Mailpit viennent du docker-compose.yml de ce dossier).
medivault.keycloak.enabled=true
medivault.keycloak.server-url=http://localhost:8180
medivault.keycloak.realm=medivault
medivault.keycloak.client-id=user-service
medivault.keycloak.client-secret=user-service-secret
medivault.security.enabled=true
medivault.security.jwk-set-uri=http://localhost:8180/realms/medivault/protocol/openid-connect/certs
