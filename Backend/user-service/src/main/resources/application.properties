spring.application.name=user-service
server.port=8081

# Config Server
spring.config.import=optional:configserver:http://localhost:8888

# MongoDB (base propre au service)
spring.data.mongodb.uri=mongodb://localhost:27017/user_db
spring.data.mongodb.auto-index-creation=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.utilisateur-cree=utilisateur.cree

# Keycloak : création des comptes, connexion (login), mot de passe oublié.
# Désactivé par défaut (développement seul). Pour tout activer : profil « keycloak »
#   SPRING_PROFILES_ACTIVE=keycloak   (voir application-keycloak.properties et docker-compose.yml)
medivault.keycloak.enabled=false
medivault.keycloak.frontend-client-id=medivault-frontend

# Sécurité JWT : false = tout est ouvert (comme avant), true = jeton Keycloak obligatoire, rôle contrôlé
medivault.security.enabled=false
medivault.security.jwk-set-uri=http://localhost:8180/realms/medivault/protocol/openid-connect/certs

# Page où Keycloak renvoie la personne après avoir changé son mot de passe (lien de l'e-mail « mot de passe oublié »)
medivault.auth.reset-redirect-uri=http://localhost:4301/login

# Pas de mot de passe généré au démarrage : la connexion passe par Keycloak
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
medivault.keycloak.server-url=http://localhost:8180
medivault.keycloak.realm=medivault
medivault.keycloak.client-id=user-service
medivault.keycloak.client-secret=change-me

# Données de démonstration : 1 patient, 1 admin, 1 médecin, 1 laboratoire et 8 pharmacies (les mêmes comptes existent dans Keycloak)
medivault.seed.enabled=true

# Signature du médecin : image PNG ou JPEG, 200 Ko maximum
spring.servlet.multipart.max-file-size=200KB
spring.servlet.multipart.max-request-size=300KB

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
