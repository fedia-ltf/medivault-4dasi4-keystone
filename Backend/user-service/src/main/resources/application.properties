spring.application.name=user-service
server.port=8081

# Config Server
spring.config.import=optional:configserver:http://localhost:8888

# MongoDB (base propre au service)
spring.data.mongodb.uri=mongodb://localhost:27017/user_db
spring.data.mongodb.auto-index-creation=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
medivault.rabbitmq.exchange=medivault.events
medivault.rabbitmq.routing-key.utilisateur-cree=utilisateur.cree

# Keycloak Admin API (désactivé tant que le realm n'est pas prêt : séance 8)
medivault.keycloak.enabled=false
medivault.keycloak.server-url=http://localhost:8180
medivault.keycloak.realm=medivault
medivault.keycloak.client-id=user-service
medivault.keycloak.client-secret=change-me

# Données de démonstration (Ahmed, Dr Karim, BioLab, Pharmacie Centrale)
medivault.seed.enabled=true

# Signature du médecin : image PNG ou JPEG, 200 Ko maximum
spring.servlet.multipart.max-file-size=200KB
spring.servlet.multipart.max-request-size=300KB

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
