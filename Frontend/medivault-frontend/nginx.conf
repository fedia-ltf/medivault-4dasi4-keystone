# nginx du front MediVault (image Docker) : le site Angular + /api relayé vers la Gateway
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Toutes les données passent par la Gateway (service « gateway » du docker-compose, port 9000)
    location /api/ {
        proxy_pass http://gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Application Angular : toute autre adresse (/app/dashboard...) renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
